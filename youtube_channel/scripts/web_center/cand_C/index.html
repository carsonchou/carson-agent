<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600">
<title>量化阿森 · 決策中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Reset ───────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input{font-family:inherit;outline:none}

/* ── Tokens ──────────────────────────────────────────────── */
:root{
  --accent:#00D4AA;
  --accent-blue:#0080FF;
  --accent-gold:#F0B64A;
  --red:#FF5E5E;
  --glass-bg:rgba(8,18,38,0.58);
  --glass-border:rgba(255,255,255,0.07);
  --glass-shine:rgba(255,255,255,0.045);
  --text-1:rgba(255,255,255,0.92);
  --text-2:rgba(255,255,255,0.52);
  --text-3:rgba(255,255,255,0.28);
  --r:14px;
  --blur:blur(28px) saturate(200%);
}

/* ── Base ────────────────────────────────────────────────── */
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#020B1C;
  color:var(--text-1);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ── BG Canvas ───────────────────────────────────────────── */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── Ambient Orbs (CSS) ──────────────────────────────────── */
.orb{
  position:fixed;border-radius:50%;filter:blur(90px);
  pointer-events:none;z-index:0;
}

/* ── App Shell ───────────────────────────────────────────── */
#app{
  position:relative;z-index:1;
  height:100vh;
  display:grid;
  grid-template-rows:60px 128px 1fr 68px;
  gap:0;
  padding:0 14px 14px;
  perspective:1200px;
}

/* ── Glass Base ──────────────────────────────────────────── */
.g{
  background:var(--glass-bg);
  backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);
  border-radius:var(--r);
  box-shadow:
    0 8px 40px rgba(0,0,0,.45),
    inset 0 1px 0 var(--glass-shine),
    0 0 0 1px rgba(0,212,170,.04);
  will-change:transform;
}
.g:hover{
  border-color:rgba(255,255,255,0.10);
  box-shadow:
    0 16px 60px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.06),
    0 0 0 1px rgba(0,212,170,.08);
}

/* ── Header ──────────────────────────────────────────────── */
#hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;
  background:rgba(4,10,22,0.82);
  backdrop-filter:blur(40px);
  border-bottom:1px solid var(--glass-border);
  position:relative;z-index:10;
  border-radius:0;
}
.brand{display:flex;align-items:center;gap:12px}
.orb-logo{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(from 180deg,#00D4AA,#0080FF,#00D4AA);
  box-shadow:0 0 22px rgba(0,212,170,.55);
  animation:spin-logo 8s linear infinite,pulse-logo 3s ease-in-out infinite;
}
@keyframes spin-logo{to{transform:rotate(360deg)}}
@keyframes pulse-logo{
  0%,100%{box-shadow:0 0 22px rgba(0,212,170,.55)}
  50%{box-shadow:0 0 40px rgba(0,212,170,.85),0 0 70px rgba(0,212,170,.2)}
}
.brand-name{font-size:16px;font-weight:700;letter-spacing:-.3px}
.brand-sub{font-size:10px;color:var(--text-3);letter-spacing:1.6px;text-transform:uppercase;margin-top:1px}

.hd-center{display:flex;align-items:center;gap:20px}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 14px;border-radius:100px;font-size:11px;
}
.pill-cyan{background:rgba(0,212,170,.1);border:1px solid rgba(0,212,170,.22);color:var(--accent)}
.pill-gold{background:rgba(240,182,74,.1);border:1px solid rgba(240,182,74,.2);color:var(--accent-gold)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.cloud-row{display:flex;gap:18px}
.cs{text-align:center}
.cs-v{
  font-size:15px;font-weight:700;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:-.5px;
}
.cs-l{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;margin-top:1px}

.hd-right{display:flex;align-items:center;gap:14px}
.clock{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;color:var(--text-2);letter-spacing:.5px;
}

/* ── KPI Row ─────────────────────────────────────────────── */
#kpi{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:9px;
  padding:10px 0 0;
}
.kcard{
  padding:16px 18px 14px;
  position:relative;overflow:hidden;
  cursor:default;
  transition:transform .25s cubic-bezier(.16,1,.3,1);
}
.kcard::before{
  content:'';position:absolute;
  top:0;left:15%;right:15%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,212,170,.6),transparent);
}
.kcard-icon{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-size:30px;opacity:.12;
}
.kcard-label{
  font-size:10px;color:var(--text-3);
  letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px;
}
.kcard-value{
  font-size:26px;font-weight:800;letter-spacing:-1.5px;
  line-height:1;margin-bottom:6px;
}
.kcard-delta{font-size:10px;display:flex;align-items:center;gap:4px}
.pos{color:var(--accent)}
.neg{color:var(--red)}
.neu{color:var(--text-3)}

/* ── Main Grid ───────────────────────────────────────────── */
#main{
  display:grid;
  grid-template-columns:266px 1fr 252px;
  gap:9px;
  padding-top:9px;
  overflow:hidden;
}

/* panel title */
.ptitle{
  font-size:10px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--text-3);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.ptitle::after{content:'';flex:1;height:1px;background:var(--glass-border)}

/* ── Left: Departments ───────────────────────────────────── */
#dept{
  padding:16px;overflow-y:auto;scrollbar-width:none;
}
#dept::-webkit-scrollbar{display:none}
.di{
  display:flex;align-items:center;gap:9px;
  padding:7px 8px;border-radius:9px;margin-bottom:3px;
  cursor:pointer;transition:background .18s;
}
.di:hover{background:rgba(255,255,255,.035)}
.dlv{width:3px;height:30px;border-radius:2px;flex-shrink:0}
.lv-S{background:linear-gradient(180deg,#F0B64A,#FF8C00)}
.lv-A{background:linear-gradient(180deg,#00D4AA,#0080FF)}
.lv-B{background:linear-gradient(180deg,#8080FF,#5040CC)}
.lv-C{background:rgba(255,255,255,0.18)}
.dinfo{flex:1;min-width:0}
.dname{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead{font-size:10px;color:var(--text-3);margin-top:2px}
.dst{font-size:10px;padding:2px 8px;border-radius:100px;flex-shrink:0;font-weight:500}
.st-online{background:rgba(0,212,170,.1);color:var(--accent);border:1px solid rgba(0,212,170,.22)}
.st-idle{background:rgba(255,255,255,.05);color:var(--text-3);border:1px solid var(--glass-border)}
.st-paused{background:rgba(240,182,74,.1);color:var(--accent-gold);border:1px solid rgba(240,182,74,.2)}
.st-error{background:rgba(255,94,94,.1);color:var(--red);border:1px solid rgba(255,94,94,.2)}

/* ── Center Panel ────────────────────────────────────────── */
#center{display:flex;flex-direction:column;gap:9px}
#chart-wrap{flex:1;padding:18px;position:relative;min-height:0}
#trend-canvas{display:block;width:100%;height:calc(100% - 36px)}
#wh-wrap{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0}
.ws{text-align:center}
.ws-v{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-.5px}
.ws-l{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.wh-prog{flex:1}
.wh-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin:6px 0}
.wh-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-blue));border-radius:2px;transition:width 1.2s cubic-bezier(.16,1,.3,1)}
.wh-labels{display:flex;justify-content:space-between;font-size:10px}

/* ── Right: Pending ──────────────────────────────────────── */
#pend{padding:16px;overflow-y:auto;scrollbar-width:none}
#pend::-webkit-scrollbar{display:none}
.pcard{
  background:rgba(255,255,255,.022);
  border:1px solid var(--glass-border);
  border-radius:12px;padding:13px;margin-bottom:9px;
  transition:border-color .2s;
}
.pcard:hover{border-color:rgba(0,212,170,.2)}
.pq{font-size:11.5px;line-height:1.55;color:var(--text-1);margin-bottom:9px}
.prec{
  font-size:10px;color:var(--accent);margin-bottom:7px;
  display:flex;align-items:center;gap:4px;
}
.popts{display:flex;flex-direction:column;gap:5px}
.obtn{
  padding:6px 10px;border-radius:8px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,.025);
  color:var(--text-2);font-size:10.5px;
  cursor:pointer;text-align:left;
  transition:all .18s;
}
.obtn:hover{
  background:rgba(0,212,170,.08);
  border-color:rgba(0,212,170,.28);
  color:var(--accent);
}
.obtn.rec{
  border-color:rgba(0,212,170,.22);color:var(--accent);
  background:rgba(0,212,170,.04);
}
.obtn.chosen{
  background:rgba(0,212,170,.18);
  border-color:rgba(0,212,170,.4);
  color:var(--accent);
}

/* ── Command Bar ─────────────────────────────────────────── */
#cmd{
  display:flex;align-items:center;gap:8px;
  padding-top:9px;
}
.cbtn{
  padding:9px 16px;border-radius:10px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,.04);
  color:var(--text-2);font-size:11.5px;font-weight:500;
  cursor:pointer;white-space:nowrap;
  backdrop-filter:blur(12px);
  transition:all .2s;
}
.cbtn:hover{
  background:rgba(0,212,170,.08);
  border-color:rgba(0,212,170,.3);
  color:var(--accent);
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(0,212,170,.15);
}
.cbtn.act{
  background:rgba(0,212,170,.12);
  border-color:rgba(0,212,170,.3);
  color:var(--accent);
}
.cbtn.fired{
  background:rgba(0,212,170,.22)!important;
  border-color:rgba(0,212,170,.45)!important;
  color:var(--accent)!important;
  transform:scale(.97);
}
.cinput{
  flex:1;padding:9px 16px;border-radius:10px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,.04);
  color:var(--text-1);font-size:11.5px;
  backdrop-filter:blur(12px);
  transition:all .2s;
}
.cinput::placeholder{color:var(--text-3)}
.cinput:focus{
  border-color:rgba(0,212,170,.35);
  background:rgba(0,212,170,.035);
  box-shadow:0 0 0 3px rgba(0,212,170,.08);
}
.csend{
  padding:9px 22px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-blue));
  color:#fff;font-size:11.5px;font-weight:700;
  cursor:pointer;white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,212,170,.35);
  transition:all .2s;
}
.csend:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 30px rgba(0,212,170,.55);
}
.csend:active{transform:scale(.97)}

/* ── Scroll fade top/bottom ──────────────────────────────── */
#dept{mask:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%)}
#pend{mask:linear-gradient(to bottom,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%)}
</style>
</head>
<body>

<!-- CSS Ambient Orbs -->
<div class="orb" style="width:500px;height:500px;background:rgba(0,212,170,.055);top:-140px;left:-100px;animation:float1 9s ease-in-out infinite"></div>
<div class="orb" style="width:700px;height:700px;background:rgba(0,128,255,.04);bottom:-250px;right:-180px;animation:float2 12s ease-in-out infinite"></div>
<div class="orb" style="width:350px;height:350px;background:rgba(240,182,74,.03);top:35%;left:35%;animation:float3 7s ease-in-out infinite"></div>
<style>
@keyframes float1{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-24px) scale(1.04)}}
@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(18px)}}
@keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-14px)}}
</style>

<!-- Three.js Space Background -->
<canvas id="bg"></canvas>

<!-- App -->
<div id="app">

  <!-- ① Header ──────────────────────────────── -->
  <header id="hd">

      <div class="orb-logo"></div>

      </div>
    </div>

    <div class="hd-center">
      <div class="pill pill-cyan">
        <div class="dot"></div>
        <span id="cloud-label">雲端在線</span>
      </div>
      <div class="cloud-row" id="cloud-row"></div>
      <div class="pill pill-cyan" style="gap:5px">
        運行中 <strong id="rc" style="font-weight:700"></strong> 個 Agent
      </div>

    <div class="hd-right">
      <div class="pill pill-gold" id="focus-tag"></div>

  </header>

  <!-- ② KPI Row ─────────────────────────────── -->
  <div id="kpi"></div>

  <!-- ③ Main Grid ────────────────────────────── -->
  <div id="main">

    <!-- Left: 18 Departments -->
    <div id="dept" class="g" data-d="0.018">
      <div class="ptitle">18 部門總覽</div>
      <div id="dept-list"></div>
    </div>

    <!-- Center: Chart + Warehouse -->
    <div id="center">
      <div id="chart-wrap" class="g" data-d="0.008">
        <div class="ptitle">28 日觀看走勢</div>

      </div>
      <div id="wh-wrap" class="g" data-d="0.013">
        <div id="wh-inner"></div>
      </div>

    <!-- Right: Pending Decisions -->
    <div id="pend" class="g" data-d="0.024">
      <div class="ptitle">待拍板決策</div>

  </div>

  <!-- ④ Command Bar ──────────────────────────── -->
  <div id="cmd">
    <button class="cbtn act" onclick="fire(this,'補產腳本')">補產腳本</button>
    <button class="cbtn" onclick="fire(this,'批量上架')">批量上架</button>
    <button class="cbtn act" onclick="fire(this,'跑一輪')">跑一輪</button>
    <button class="cbtn" onclick="fire(this,'壓榨模式')">壓榨模式</button>
    <button class="cbtn" onclick="fire(this,'重新評分')">重新評分</button>
    <button class="cbtn" onclick="fire(this,'大檢查')">大檢查</button>
    <input class="cinput" id="sec-input" placeholder="跟小秘說…（Shift+Enter 換行）" />
    <button class="csend" onclick="send()">發送</button>
  </div>

</div><!-- #app -->

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   SAMPLE STATE
═══════════════════════════════════════════════════════════ */
window.__STATE__ = {
  kpi:{
    subs:25, subs_gained:24,
    views:6204, views_28:5482,
    retention:40.1, minutes_28:1035,
    net:-4696, sub_gap:975
  },
  series:[
    {date:'06/18',views:340},{date:'06/19',views:298},{date:'06/20',views:420},

  ],

    {tag:'THUMB',name:'縮圖設計部', head:'ThumbAI',     status:'online', level:'B'},

  ],

  paused:false,
  running_count:8
};

/* ═══════════════════════════════════════════════════════════
   BOOTSTRAP
═══════════════════════════════════════════════════════════ */
const S = window.__STATE__;

/* ── Clock ─────────────────────────────────────────────── */
function tick(){
  const n=new Date();
  document.getElementById('clock').textContent=
    [n.getHours(),n.getMinutes(),n.getSeconds()]
      .map(x=>String(x).padStart(2,'0')).join(':');
}
setInterval(tick,1000); tick();

/* ── Header ────────────────────────────────────────────── */
document.getElementById('focus-tag').textContent=S.focus;
document.getElementById('rc').textContent=S.running_count;
document.getElementById('cloud-row').innerHTML=`
  <div class="cs"><div class="cs-v">${S.cloud.produced_today}</div><div class="cs-l">今日產出</div></div>
  <div class="cs"><div class="cs-v">${S.cloud.uploaded_today}</div><div class="cs-l">今日上架</div></div>
  <div class="cs"><div class="cs-v">${S.cloud.queue}</div><div class="cs-l">佇列</div></div>
  <div class="cs"><div class="cs-v" style="color:var(--accent)">${S.cloud.render}</div><div class="cs-l">渲染</div></div>
`;

/* ── Pending Decisions ─────────────────────────────────── */
document.getElementById('pend-list').innerHTML=S.pending.map(p=>`
  <div class="pcard">
    <div class="pq">${p.question}</div>
    <div class="prec">⚡ 建議：${p.recommendation}</div>
    <div class="popts">
      ${p.options.map(o=>`
        <button class="obtn${o===p.recommendation?' rec':''}" onclick="pick(this)">

      `).join('')}
    </div>
  </div>
`).join('');

/* ── Command Bar callbacks ─────────────────────────────── */
function fire(btn,name){
  btn.classList.add('fired');
  const orig=btn.textContent;
  btn.textContent=name+' ✓';
  setTimeout(()=>{btn.classList.remove('fired');btn.textContent=orig;},2200);
}

function send(){
  const inp=document.getElementById('sec-input');
  const msg=inp.value.trim();
  if(!msg)return;
  const saved=inp.placeholder;
  inp.value='';
  inp.placeholder='已傳送：'+msg;
  setTimeout(()=>{inp.placeholder=saved;},3000);
}

document.getElementById('sec-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});

function pick(btn){
  const card=btn.closest('.pcard');
  card.querySelectorAll('.obtn').forEach(b=>b.classList.remove('chosen'));
  btn.classList.add('chosen');
}

/* ═══════════════════════════════════════════════════════════
   TREND CHART
═══════════════════════════════════════════════════════════ */
function renderChart(){
  const canvas=document.getElementById('trend-canvas');
  const wrap=document.getElementById('chart-wrap');
  const W=wrap.clientWidth-36;
  const H=wrap.clientHeight-60;
  if(W<=0||H<=0)return;
  canvas.width=W*devicePixelRatio;
  canvas.height=H*devicePixelRatio;
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(devicePixelRatio,devicePixelRatio);

  const data=S.series;
  const vals=data.map(d=>d.views);
  const min=Math.min(...vals)*.88;
  const max=Math.max(...vals)*1.08;
  const range=max-min;
  const n=data.length;
  const pL=42,pR=18,pT=16,pB=32;
  const cW=W-pL-pR,cH=H-pT-pB;

  const xp=i=>pL+(i/(n-1))*cW;
  const yp=v=>pT+cH-((v-min)/range)*cH;

  ctx.clearRect(0,0,W,H);

  /* grid */
  for(let i=0;i<=4;i++){
    const y=pT+(i/4)*cH;
    ctx.strokeStyle='rgba(255,255,255,0.045)';
    ctx.lineWidth=1;
    ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();
    ctx.setLineDash([]);
    const lv=Math.round(max-(i/4)*range);
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.font=`10px 'Inter'`;ctx.textAlign='right';
    ctx.fillText(lv>=1000?(lv/1000).toFixed(1)+'k':lv,pL-6,y+4);
  }

  /* gradient fill */
  const grd=ctx.createLinearGradient(0,pT,0,pT+cH);
  grd.addColorStop(0,'rgba(0,212,170,0.22)');
  grd.addColorStop(1,'rgba(0,212,170,0.0)');
  ctx.beginPath();
  ctx.moveTo(xp(0),pT+cH);
  for(let i=0;i<n;i++) ctx.lineTo(xp(i),yp(vals[i]));
  ctx.lineTo(xp(n-1),pT+cH);
  ctx.closePath();ctx.fillStyle=grd;ctx.fill();

  /* line */
  ctx.beginPath();
  ctx.strokeStyle='#00D4AA';ctx.lineWidth=2;
  ctx.lineJoin='round';ctx.lineCap='round';
  for(let i=0;i<n;i++)
    i===0?ctx.moveTo(xp(i),yp(vals[i])):ctx.lineTo(xp(i),yp(vals[i]));
  ctx.stroke();

  /* dots + x-labels */
  data.forEach((d,i)=>{
    const x=xp(i),y=yp(vals[i]);
    ctx.beginPath();
    ctx.arc(x,y,i===n-1?5:2.8,0,Math.PI*2);
    ctx.fillStyle='#00D4AA';ctx.fill();
    if(i===n-1){
      ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);
      ctx.strokeStyle='rgba(0,212,170,0.3)';ctx.lineWidth=2;ctx.stroke();
      /* value label */
      ctx.fillStyle='var(--accent)';
      ctx.font=`bold 11px 'JetBrains Mono'`;ctx.textAlign='center';
      ctx.fillText(vals[i],x,y-14);
    }
    if(i%2===0||i===n-1){
      ctx.fillStyle='rgba(255,255,255,0.28)';
      ctx.font=`9px 'Inter'`;ctx.textAlign='center';
      ctx.fillText(d.date,x,pT+cH+20);
    }
  });
}

window.addEventListener('load',()=>{ setTimeout(renderChart,80); });
window.addEventListener('resize',()=>{ renderChart(); });

/* ═══════════════════════════════════════════════════════════
   THREE.JS SPACE BACKGROUND
═══════════════════════════════════════════════════════════ */
(function initThree(){
  const canvas=document.getElementById('bg');
  const renderer=new THREE.WebGLRenderer({canvas,alpha:false,antialias:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0x020B1C,1);

  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
  camera.position.z=6;

  /* Stars */
  const starN=2400;
  const pos=new Float32Array(starN*3);
  for(let i=0;i<starN;i++){
    pos[i*3]  =(Math.random()-.5)*90;
    pos[i*3+1]=(Math.random()-.5)*90;
    pos[i*3+2]=(Math.random()-.5)*90;
  }
  const sg=new THREE.BufferGeometry();
  sg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const sm=new THREE.PointsMaterial({color:0xffffff,size:.07,transparent:true,opacity:.75,sizeAttenuation:true});
  const stars=new THREE.Points(sg,sm);
  scene.add(stars);

  /* Glow spheres */
  const geoSph=new THREE.SphereGeometry(1,16,16);
  function addGlow(col,x,y,z,s,op=.09){
    const m=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op});
    const mesh=new THREE.Mesh(geoSph,m);
    mesh.position.set(x,y,z);mesh.scale.setScalar(s);
    scene.add(mesh);return mesh;
  }
  const g1=addGlow(0x00D4AA,-3.5,2.5,-7,4);
  const g2=addGlow(0x0080FF,4.5,-2.5,-10,5.5,.07);
  const g3=addGlow(0xF0B64A,1,3.5,-5,2.5,.06);

  let mx=0,my=0,tx=0,ty=0;
  window.addEventListener('mousemove',e=>{
    mx=(e.clientX/innerWidth-.5)*2;
    my=-(e.clientY/innerHeight-.5)*2;
  });

  let t=0;
  (function loop(){
    requestAnimationFrame(loop);
    t+=.004;
    tx+=(mx*.4-tx)*.025;
    ty+=(my*.25-ty)*.025;
    camera.position.x=tx;camera.position.y=ty;
    camera.lookAt(0,0,0);
    stars.rotation.y=t*.025;stars.rotation.x=t*.008;
    g1.position.y=2.5+Math.sin(t*.65)*.6;
    g2.position.y=-2.5+Math.cos(t*.45)*.9;
    g3.position.x=1+Math.sin(t*.3)*1.2;
    renderer.render(scene,camera);
  })();

  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    renderChart();
  });
})();

/* ═══════════════════════════════════════════════════════════
   MOUSE PARALLAX (panel 3D tilt + translate)
═══════════════════════════════════════════════════════════ */
(function initParallax(){
  let mx=0,my=0,tx=0,ty=0;
  window.addEventListener('mousemove',e=>{
    mx=(e.clientX/innerWidth-.5)*2;
    my=(e.clientY/innerHeight-.5)*2;
  });
  const els=document.querySelectorAll('[data-d]');
  (function loop(){
    requestAnimationFrame(loop);
    tx+=(mx-tx)*.06;
    ty+=(my-ty)*.06;
    els.forEach(el=>{
      const d=parseFloat(el.dataset.d||'.01');
      const dx=tx*d*80;
      const dy=ty*d*80;
      const rx=ty*d*120;
      const ry=tx*d*120;
      el.style.transform=`translate(${dx}px,${dy}px) rotateX(${-rx}deg) rotateY(${ry}deg)`;
    });
  })();
})();

/* ═══════════════════════════════════════════════════════════
   KPI card hover lift (separate from parallax)
═══════════════════════════════════════════════════════════ */
document.querySelectorAll('.kcard').forEach(el=>{
  el.addEventListener('mouseenter',()=>{
    el.style.boxShadow='0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(0,212,170,.12)';
  });
  el.addEventListener('mouseleave',()=>{
    el.style.boxShadow='';
  });
});
</script>
