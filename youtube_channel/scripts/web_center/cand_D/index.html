<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化阿森 · 決策中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #050d1a;
  --bg2:     #0a1230;
  --gold:    #ffcf4a;
  --gold2:   #ffd96b;
  --cyan:    #00e5ff;
  --cyan2:   #4dfaff;
  --purple:  #7c3aed;
  --green:   #00ff88;
  --red:     #ef4444;
  --amber:   #f59e0b;
  --text:    #c8d8f0;
  --text2:   #6a84a8;
  --glass:   rgba(8,20,56,0.72);
  --border:  rgba(0,229,255,0.18);
  --gold-gl: 0 0 22px rgba(255,207,74,0.45);
  --cyan-gl: 0 0 22px rgba(0,229,255,0.45);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  width:100vw;height:100vh;
  user-select:none;
}
canvas#bg-canvas{
  position:fixed;inset:0;z-index:0;
  width:100%;height:100%;
}
#app{
  position:fixed;inset:0;z-index:1;
  display:flex;flex-direction:column;
  padding:10px;gap:8px;
  overflow:hidden;
}

/* ── TOP BAR ── */
#top-bar{
  display:flex;align-items:center;gap:14px;
  background:var(--glass);
  backdrop-filter:blur(24px);
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 18px;height:50px;
  flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-orb{
  width:30px;height:30px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--gold),var(--cyan),var(--purple),var(--gold));
  animation:orbspin 6s linear infinite;
  box-shadow:0 0 18px var(--gold),0 0 36px rgba(255,207,74,.25);
  flex-shrink:0;
}
@keyframes orbspin{to{transform:rotate(360deg);}}
.brand-name{
  font-family:'Orbitron',monospace;
  font-size:14px;font-weight:900;
  color:var(--gold);letter-spacing:3px;
  text-shadow:0 0 20px var(--gold);
}
.brand-sub{font-size:9px;color:var(--text2);letter-spacing:2px;margin-top:1px;}
.hdiv{width:1px;height:28px;background:var(--border);}
.status-pill{
  display:flex;align-items:center;gap:5px;
  padding:3px 11px;border-radius:20px;
  font-size:11px;border:1px solid;
}
.status-pill.online{
  background:rgba(0,255,136,.08);
  border-color:var(--green);color:var(--green);
}
.status-pill .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:blink 1.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(1.4);}}
.hstats{display:flex;gap:14px;font-size:11px;color:var(--text2);}
.hstats strong{color:var(--cyan);font-weight:600;}
.spacer{flex:1;}
.focus-msg{
  font-size:11px;color:var(--gold);
  letter-spacing:.5px;
  text-shadow:0 0 12px var(--gold);
  white-space:nowrap;
}
#clock{
  font-family:'Orbitron',monospace;
  font-size:17px;font-weight:700;
  color:var(--cyan);letter-spacing:3px;
  text-shadow:0 0 16px var(--cyan);
  flex-shrink:0;
}

/* ── MAIN GRID ── */
.main-grid{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:298px 1fr 298px;
  gap:8px;overflow:hidden;
}

/* ── GLASS PANEL ── */
.panel{
  background:var(--glass);
  backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;overflow:hidden;
}
.ptitle{
  font-family:'Orbitron',monospace;
  font-size:10px;font-weight:700;
  color:var(--cyan);letter-spacing:2px;
  margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.ptitle::before{
  content:'';display:inline-block;
  width:3px;height:12px;
  background:var(--cyan);border-radius:2px;
  box-shadow:0 0 8px var(--cyan);
}

/* ── LEFT COL ── */
.left-col{
  display:flex;flex-direction:column;
  gap:8px;overflow:hidden;
}
.kpi-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:7px;
}
.kpi-card{
  background:rgba(6,15,40,.88);
  border:1px solid rgba(0,229,255,.12);
  border-radius:10px;padding:11px;
  position:relative;overflow:hidden;
  transition:border-color .25s,box-shadow .25s;
  cursor:default;
}
.kpi-card:hover{border-color:var(--cyan);box-shadow:var(--cyan-gl);}
.kpi-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(130deg,rgba(0,229,255,.05) 0%,transparent 55%);
  pointer-events:none;
}
.kl{font-size:9px;color:var(--text2);letter-spacing:1px;margin-bottom:5px;text-transform:uppercase;}
.kv{
  font-family:'Orbitron',monospace;
  font-size:24px;font-weight:900;line-height:1;margin-bottom:3px;
}
.kv.gold{color:var(--gold);text-shadow:0 0 18px rgba(255,207,74,.7);}
.kv.cyan{color:var(--cyan);text-shadow:0 0 18px rgba(0,229,255,.7);}
.kv.green{color:var(--green);text-shadow:0 0 18px rgba(0,255,136,.7);}
.kv.red{color:var(--red);text-shadow:0 0 18px rgba(239,68,68,.7);}
.ks{font-size:9px;color:var(--text2);}
.float{animation:floaty 4s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}

/* chart panel needs flex col */
#chart-panel{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
}
#trend-canvas{flex:1;min-height:0;display:block;}

/* warehouse */
.wrow{
  display:flex;align-items:center;
  justify-content:space-between;
  font-size:11px;margin-bottom:6px;
}
.wbar-bg{
  width:100%;height:5px;
  background:rgba(255,255,255,.07);
  border-radius:3px;overflow:hidden;margin-top:3px;
}
.wbar-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--cyan),var(--gold));
  box-shadow:0 0 8px var(--cyan);
  transition:width .6s ease;
}

/* ── CENTER (GALAXY) ── */
.galaxy-panel{
  display:flex;flex-direction:column;
  overflow:hidden;
  padding:12px 8px 8px 8px;
}
#galaxy-svg{flex:1;min-height:0;width:100%;overflow:visible;}

/* ── RIGHT COL ── */
.right-col{
  display:flex;flex-direction:column;
  gap:0;overflow:hidden;
}
.pending-panel{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
}
.plist{
  flex:1;overflow-y:auto;
  display:flex;flex-direction:column;gap:8px;
  padding-right:3px;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}
.plist::-webkit-scrollbar{width:3px;}
.plist::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.pd-card{
  background:rgba(6,15,40,.8);
  border:1px solid rgba(255,207,74,.18);
  border-radius:10px;padding:10px;
  transition:border-color .25s,box-shadow .25s;
  flex-shrink:0;
}
.pd-card:hover{border-color:var(--gold);box-shadow:var(--gold-gl);}
.pd-id{
  font-family:'Orbitron',monospace;
  font-size:8px;color:var(--gold);
  letter-spacing:2px;margin-bottom:5px;
}
.pd-q{font-size:11px;color:var(--text);line-height:1.5;margin-bottom:8px;}
.pd-opts{display:flex;gap:5px;flex-wrap:wrap;}
.opt-btn{
  padding:3px 9px;border-radius:5px;
  font-size:10px;border:1px solid var(--border);
  background:transparent;color:var(--text2);
  cursor:pointer;transition:all .2s;
  font-family:'Noto Sans TC',sans-serif;
}
.opt-btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 8px rgba(0,229,255,.3);}
.opt-btn.rec{
  border-color:var(--gold);color:var(--gold);
  background:rgba(255,207,74,.1);
  box-shadow:0 0 8px rgba(255,207,74,.2);
}
.opt-btn.sel{
  border-color:var(--cyan);color:var(--cyan);
  background:rgba(0,229,255,.18);
  box-shadow:0 0 12px rgba(0,229,255,.4);
}

/* ── CMD BAR ── */
#cmd-bar{
  display:flex;align-items:center;gap:6px;
  background:var(--glass);
  backdrop-filter:blur(24px);
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 14px;height:48px;
  flex-shrink:0;
}
.ops-strip{
  display:flex;align-items:center;gap:5px;
  max-width:160px;overflow:hidden;flex-shrink:0;
}
.ops-lbl{font-size:9px;color:var(--text2);white-space:nowrap;}
.ops-roll{
  font-size:9px;color:var(--green);
  white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
  max-width:100px;
}
.bdiv{width:1px;height:28px;background:var(--border);flex-shrink:0;}
.cmd-btn{
  display:flex;align-items:center;gap:3px;
  padding:5px 12px;border-radius:7px;
  font-size:11px;font-family:'Noto Sans TC',sans-serif;
  border:1px solid var(--border);
  background:rgba(0,229,255,.07);
  color:var(--text);cursor:pointer;
  transition:all .2s;white-space:nowrap;
  flex-shrink:0;
}
.cmd-btn:hover{
  border-color:var(--cyan);color:var(--cyan);
  background:rgba(0,229,255,.15);
  box-shadow:0 0 10px rgba(0,229,255,.3);
  transform:translateY(-1px);
}
.cmd-btn:active{transform:translateY(0);}
.cmd-btn.g{border-color:rgba(255,207,74,.28);background:rgba(255,207,74,.07);}
.cmd-btn.g:hover{
  border-color:var(--gold);color:var(--gold);
  background:rgba(255,207,74,.15);
  box-shadow:0 0 10px rgba(255,207,74,.3);
}
.sec-wrap{display:flex;align-items:center;gap:7px;flex:1;min-width:0;}
.sec-lbl{font-size:10px;color:var(--gold);white-space:nowrap;letter-spacing:1px;flex-shrink:0;}
#sec-in{
  flex:1;min-width:0;height:32px;
  background:rgba(0,229,255,.06);
  border:1px solid var(--border);
  border-radius:7px;
  color:var(--text);font-size:12px;
  padding:0 10px;
  font-family:'Noto Sans TC',sans-serif;
  outline:none;transition:border-color .2s;
}
#sec-in:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.2);}
#sec-in::placeholder{color:var(--text2);}
.send-btn{
  width:32px;height:32px;border-radius:7px;
  background:rgba(255,207,74,.14);
  border:1px solid rgba(255,207,74,.28);
  color:var(--gold);font-size:15px;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.send-btn:hover{background:rgba(255,207,74,.28);box-shadow:var(--gold-gl);}

/* ── TOOLTIP ── */
#tt{
  position:fixed;
  background:rgba(6,15,40,.96);
  border:1px solid var(--cyan);
  border-radius:8px;padding:7px 11px;
  font-size:11px;color:var(--text);
  pointer-events:none;z-index:200;
  display:none;backdrop-filter:blur(12px);
  box-shadow:var(--cyan-gl);
}
#tt strong{
  display:block;margin-bottom:3px;
  font-family:'Orbitron',monospace;
  font-size:9px;color:var(--cyan);letter-spacing:1px;
}
</style>
</head>

      <span class="sec-lbl">🔮 跟小祕說</span>
      <input id="sec-in" type="text" placeholder="輸入指令或問題…"
        onkeydown="if(event.key==='Enter')sendSec()">
      <button class="send-btn" onclick="sendSec()">↑</button>
    </div>
  </div>
</div>

<div id="tt"></div>

/* ═══════════════════════════════════════
   THREE.JS NEBULA BACKGROUND
═══════════════════════════════════════ */
(function initNebula(){
  const canvas = document.getElementById('bg-canvas');
  const scene  = new THREE.Scene();
  const W = window.innerWidth, H = window.innerHeight;
  const camera = new THREE.PerspectiveCamera(70, W/H, 0.1, 1000);
  camera.position.z = 58;

  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x050d1a, 1);

  /* Star field */
  const N = 4500;
  const sPos = new Float32Array(N*3);
  for(let i=0;i<N*3;i++) sPos[i]=(Math.random()-.5)*320;
  const sGeo = new THREE.BufferGeometry();
  sGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
  const sMat = new THREE.PointsMaterial({color:0xc8d8f0,size:.22,transparent:true,opacity:.85});
  const stars = new THREE.Points(sGeo,sMat);
  scene.add(stars);

  /* Nebula clouds */
  function addCloud(count,color,size,opacity,spread,ox,oy){
    const geo=new THREE.BufferGeometry();
    const pos=new Float32Array(count*3);
    for(let i=0;i<count;i++){
      const r=Math.pow(Math.random(),0.5)*spread;
      const th=Math.random()*Math.PI*2;
      const ph=Math.random()*Math.PI;
      pos[i*3]  =ox+r*Math.sin(ph)*Math.cos(th);
      pos[i*3+1]=oy+r*Math.sin(ph)*Math.sin(th);
      pos[i*3+2]=(Math.random()-.5)*spread*.6;
    }
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const mat=new THREE.PointsMaterial({
      color,size,transparent:true,opacity,
      blending:THREE.AdditiveBlending,depthWrite:false
    });
    scene.add(new THREE.Points(geo,mat));
  }
  addCloud(700,0xffcf4a,1.9,.11,42, 28,-8);   // gold
  addCloud(700,0x00e5ff,1.9,.11,42,-28, 8);   // cyan
  addCloud(450,0x7c3aed,2.4,.07,55,  0,12);   // purple
  addCloud(220,0x00ff88,1.2,.14,22, 18,18);   // green
  addCloud(350,0xffffff,.45,.55,90,  0, 0);   // bright points

  /* Constellation lines */
  const pts=[];
  for(let i=0;i<90;i++){
    pts.push([(Math.random()-.5)*160,(Math.random()-.5)*110,(Math.random()-.5)*60]);
  }
  const lineVerts=[];
  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      const dx=pts[i][0]-pts[j][0],dy=pts[i][1]-pts[j][1],dz=pts[i][2]-pts[j][2];
      if(Math.sqrt(dx*dx+dy*dy+dz*dz)<20) lineVerts.push(...pts[i],...pts[j]);
    }
  }
  const lGeo=new THREE.BufferGeometry();
  lGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lineVerts),3));
  const lMat=new THREE.LineBasicMaterial({color:0x00e5ff,transparent:true,opacity:.055});
  scene.add(new THREE.LineSegments(lGeo,lMat));

  /* Slow galaxy spin */
  let t=0;
  (function loop(){
    requestAnimationFrame(loop);
    t+=.001;
    stars.rotation.y=t*.12;
    stars.rotation.x=t*.04;
    renderer.render(scene,camera);
  })();

  window.addEventListener('resize',()=>{
    const w=window.innerWidth,h=window.innerHeight;
    camera.aspect=w/h;camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  });
})();

const SC={

  idle:'#3d4e68',    paused:'#f59e0b', standby:'#7c3aed', warning:'#ef4444'

const SL={
  running:'運行中',online:'在線',done:'完成',
  idle:'待機',paused:'暫停',standby:'備戰',warning:'警告'

/* ═══════════════════════════════════════
   TREND CHART (Canvas 2D)
═══════════════════════════════════════ */
function renderTrend(){
  const panel=document.getElementById('chart-panel');
  const canvas=document.getElementById('trend-canvas');
  const W=canvas.offsetWidth, H=canvas.offsetHeight;
  if(W<=0||H<=0){setTimeout(renderTrend,80);return;}
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  const data=S.series.map(d=>d.v);
  const labels=S.series.map(d=>d.d);
  const hi=Math.max(...data)*1.15;
  const P={t:8,r:8,b:26,l:36};
  const cW=W-P.l-P.r, cH=H-P.t-P.b;
  const n=data.length;
  const px=i=>P.l+(i/(n-1))*cW;
  const py=v=>P.t+(1-v/hi)*cH;

  ctx.clearRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(0,229,255,.07)';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
  }

  // Fill gradient
  const grad=ctx.createLinearGradient(0,P.t,0,P.t+cH);
  grad.addColorStop(0,'rgba(0,229,255,.28)');
  grad.addColorStop(1,'rgba(0,229,255,0)');
  ctx.beginPath();
  ctx.moveTo(px(0),py(data[0]));
  for(let i=1;i<n;i++) ctx.lineTo(px(i),py(data[i]));
  ctx.lineTo(px(n-1),P.t+cH);
  ctx.lineTo(px(0),P.t+cH);
  ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();

  // Gold accent on last point
  const lastGrad=ctx.createLinearGradient(px(n-3),0,px(n-1),0);
  lastGrad.addColorStop(0,'rgba(0,229,255,0)');
  lastGrad.addColorStop(1,'rgba(255,207,74,.4)');
  ctx.beginPath();
  ctx.moveTo(px(n-3),py(data[n-3]));
  for(let i=n-2;i<n;i++) ctx.lineTo(px(i),py(data[i]));
  ctx.lineTo(px(n-1),P.t+cH);ctx.lineTo(px(n-3),P.t+cH);
  ctx.closePath();ctx.fillStyle=lastGrad;ctx.fill();

  // Line
  ctx.beginPath();ctx.strokeStyle='#00e5ff';
  ctx.lineWidth=1.8;ctx.lineJoin='round';
  ctx.shadowColor='#00e5ff';ctx.shadowBlur=10;
  ctx.moveTo(px(0),py(data[0]));
  for(let i=1;i<n;i++) ctx.lineTo(px(i),py(data[i]));
  ctx.stroke();ctx.shadowBlur=0;

  // Points
  data.forEach((v,i)=>{
    const isLast=i===n-1;
    ctx.beginPath();
    ctx.arc(px(i),py(v),isLast?4:2.5,0,Math.PI*2);
    ctx.fillStyle=isLast?'#ffcf4a':'#00e5ff';
    ctx.shadowColor=isLast?'#ffcf4a':'#00e5ff';ctx.shadowBlur=10;
    ctx.fill();ctx.shadowBlur=0;
  });

  // Labels
  ctx.font='8px Noto Sans TC';ctx.fillStyle='rgba(106,132,168,.8)';
  ctx.textAlign='center';
  labels.forEach((lb,i)=>{
    if(i===0||i===Math.floor(n/2)||i===n-1)
      ctx.fillText(lb,px(i),H-5);
  });

  // Y axis
  ctx.textAlign='right';
  [0,.5,1].forEach(f=>{
    const v=Math.round(hi*(1-f));
    ctx.fillText(v,P.l-4,P.t+f*cH+3);
  });
}

/* ═══════════════════════════════════════
   GALAXY SVG
═══════════════════════════════════════ */
function renderGalaxy(){
  const svg=document.getElementById('galaxy-svg');
  const VW=580,VH=490,CX=290,CY=248;
  const depts=S.departments;

  // Spiral positions (golden angle, annular zone r=52..215)
  const GA=Math.PI*(3-Math.sqrt(5));
  const pos=depts.map((_,i)=>{
    const norm=(i+.5)/depts.length;
    const r=52+Math.sqrt(norm)*163;
    const th=i*GA;
    return{x:CX+r*Math.cos(th),y:CY+r*Math.sin(th)};
  });

  // Connections (nearby pairs)
  const conns=[];
  for(let i=0;i<pos.length;i++){
    for(let j=i+1;j<pos.length;j++){
      const dx=pos[i].x-pos[j].x,dy=pos[i].y-pos[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<100) conns.push({i,j,d});
    }
  }

  let h=`<defs>
    <filter id="gs"><feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gm"><feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gl"><feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="cx-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcf4a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffcf4a" stop-opacity="0"/>
    </radialGradient>
  </defs>`;

  // Orbital rings
  [58,115,178,220].forEach((r,i)=>{
    h+=`<ellipse cx="${CX}" cy="${CY}" rx="${r}" ry="${r*.82}" fill="none"
        stroke="rgba(0,229,255,${.05-i*.01})" stroke-width="1"/>`;
  });

  // Center nexus
  h+=`<circle cx="${CX}" cy="${CY}" r="30" fill="url(#cx-grad)" filter="url(#gl)"/>`;
  h+=`<circle cx="${CX}" cy="${CY}" r="10" fill="rgba(255,207,74,.9)" filter="url(#gm)">
        <animate attributeName="r" values="9;12;9" dur="3s" repeatCount="indefinite"/>
      </circle>`;
  h+=`<text x="${CX}" y="${CY+22}" text-anchor="middle"
       font-family="Orbitron" font-size="7.5" fill="rgba(255,207,74,.65)"
       letter-spacing="2">NEXUS</text>`;

  // Connection lines
  conns.forEach(({i,j,d})=>{
    const a=(0.38-d/280).toFixed(2);
    if(a<=0) return;
    h+=`<line x1="${pos[i].x.toFixed(1)}" y1="${pos[i].y.toFixed(1)}"
             x2="${pos[j].x.toFixed(1)}" y2="${pos[j].y.toFixed(1)}"
             stroke="${SC[depts[i].status]}" stroke-width=".7" opacity="${a}"/>`;
  });

  // Department nodes
  depts.forEach((d,i)=>{
    const p=pos[i];
    const col=SC[d.status];
    const r=10+d.level*2.5;
    const filt=d.level===3?'url(#gl)':d.level===2?'url(#gm)':'url(#gs)';
    const pulsing=d.status==='running'||d.status==='online';
    const dur=(2.2+Math.random()*1.4).toFixed(1)+'s';

    h+=`<g class="dept-node" data-i="${i}"
           onmouseenter="showTT(event,${i})" onmouseleave="hideTT()">`;

    // Pulse ring for active
    if(pulsing){
      h+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r+4}"
               fill="none" stroke="${col}" stroke-width=".8" opacity=".25">
            <animate attributeName="r" values="${r+2};${r+9};${r+2}" dur="${dur}" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".25;.03;.25" dur="${dur}" repeatCount="indefinite"/>
          </circle>`;
    }

    // Node body
    h+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}"
             fill="rgba(6,15,40,.92)" stroke="${col}" stroke-width="1.4"
             filter="${filt}" style="transition:filter .2s"/>`;

    // Tag label
    const fs=d.tag.length>4?6.5:7.5;
    h+=`<text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}"
             text-anchor="middle" dominant-baseline="middle"
             font-family="Orbitron" font-size="${fs}" fill="${col}" font-weight="700"
             pointer-events="none">${d.tag}</text>`;

    // Status indicator dot
    h+=`<circle cx="${(p.x+r-2).toFixed(1)}" cy="${(p.y-r+2).toFixed(1)}"
             r="2.5" fill="${col}" filter="url(#gs)"/>`;
    h+=`</g>`;
  });

  // Legend at bottom
  const legendItems=Object.entries(SL);
  const lStartX=14;
  legendItems.forEach(([st,lb],i)=>{
    const lx=lStartX+i*80;
    h+=`<circle cx="${lx}" cy="${VH-18}" r="4" fill="${SC[st]}"/>`;
    h+=`<text x="${lx+8}" y="${VH-14}"
             font-family="Noto Sans TC" font-size="8.5" fill="rgba(200,216,240,.5)">${lb}</text>`;
  });

  // Running count badge
  const rc=S.departments.filter(d=>d.status==='running'||d.status==='online').length;
  h+=`<text x="${VW-12}" y="18" text-anchor="end"
       font-family="Orbitron" font-size="8" fill="rgba(0,229,255,.5)"
       letter-spacing="1">${rc} ACTIVE</text>`;

  svg.innerHTML=h;
}

/* ═══════════════════════════════════════
   PENDING DECISIONS
═══════════════════════════════════════ */
function renderPending(){
  document.getElementById('plist').innerHTML=S.pending.map((p,pi)=>`
    <div class="pd-card">
      <div class="pd-id">[ ${p.id} ]</div>
      <div class="pd-q">${p.q}</div>
      <div class="pd-opts">
        ${p.opts.map((o,oi)=>`
          <button class="opt-btn ${o===p.rec?'rec':''}"
            onclick="pickOpt(this,${pi},${oi})">${o}</button>`).join('')}
      </div>
    </div>`).join('');
}
window.pickOpt=function(btn,pi,oi){
  const card=btn.closest('.pd-card');
  card.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
};

  document.getElementById('ops-roll').textContent=S.ops.join(' · ');
}

/* ═══════════════════════════════════════
   CLOCK
═══════════════════════════════════════ */
function tickClock(){
  const n=new Date();
  const pad=x=>String(x).padStart(2,'0');
  document.getElementById('clock').textContent=
    `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
}

/* ═══════════════════════════════════════
   COMMAND ACTIONS
═══════════════════════════════════════ */
window.execOp=function(op){
  const el=document.getElementById('focus-msg');
  const orig=el.textContent;
  el.style.color='var(--cyan)';
  el.textContent=`⚡ ${op}  已送出`;
  setTimeout(()=>{el.style.color='';el.textContent=orig;},2200);
};
window.sendSec=function(){
  const inp=document.getElementById('sec-in');
  const msg=inp.value.trim();
  if(!msg) return;
  inp.value='';
  inp.placeholder=`✓ 已記錄：${msg}`;
  setTimeout(()=>inp.placeholder='輸入指令或問題…',3000);
};

/* ═══════════════════════════════════════
   TOOLTIP
═══════════════════════════════════════ */
const ttEl=document.getElementById('tt');
window.showTT=function(e,i){
  const d=S.departments[i];
  ttEl.innerHTML=`<strong>${d.tag}</strong>${d.name}<br>
    負責人: ${d.head}<br>狀態: ${SL[d.status]}&nbsp;
    <span style="color:${SC[d.status]}">●</span>`;
  ttEl.style.display='block';
  ttEl.style.left=(e.clientX+14)+'px';
  ttEl.style.top=(e.clientY-12)+'px';
};
window.hideTT=function(){ttEl.style.display='none';};

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
function init(){
  renderHeader();
  renderKPIs();
  renderWarehouse();
  renderGalaxy();
  renderPending();
  renderOps();
  tickClock();
  setInterval(tickClock,1000);
  // Chart after layout settles
  setTimeout(renderTrend,120);
  window.addEventListener('resize',()=>setTimeout(renderTrend,120));
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
</script>
